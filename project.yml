name: KeyFlip
options:
  bundleIdPrefix: com.barakmayer
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  KeyFlip:
    type: application
    platform: macOS
    sources:
      - Sources/KeyFlip
    info:
      path: Sources/KeyFlip/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: KeyFlip
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barakmayer.KeyFlip
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KeyFlipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KeyFlipTests
      - Sources/KeyFlip/LayoutConverter.swift
      - Sources/KeyFlip/InputSourceManager.swift
      - Sources/KeyFlip/SelectionService.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KeyFlip:
    build:
      targets:
        KeyFlip: all
        KeyFlipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeyFlipTests
